<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pantry">
<meta name="theme-color" content="#f5f4ef">
<title>Pantry &amp; Shopping</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231a1a1a'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white'%3E🛒%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:#f7f6f1;min-height:100vh;margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif;color:#1a1a1a;}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
.tabs{display:flex;background:#fff;border-bottom:0.5px solid rgba(0,0,0,.1);position:sticky;top:0;z-index:100;padding-top:env(safe-area-inset-top);}
.tab{flex:1;padding:15px 8px;text-align:center;font-size:14px;font-weight:500;color:#999;cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;transition:all .15s;}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a;}
.screen{display:none;max-width:640px;margin:0 auto;padding:16px;}
.screen.active{display:block;}
.hdr h1{font-size:22px;font-weight:600;margin:4px 0 2px;}
.intro{font-size:13px;color:#666;margin:0 0 14px;line-height:1.5;}
.legend{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.legend span{font-size:11px;padding:4px 9px;border-radius:20px;font-weight:600;}
.section-title{font-size:11px;font-weight:700;color:#999;letter-spacing:.07em;text-transform:uppercase;margin:20px 0 8px;}
.oos-count{display:inline-block;background:#fee;border:0.5px solid #fcc;border-radius:20px;font-size:12px;color:#c0392b;padding:3px 10px;margin-bottom:14px;font-weight:500;}
.add-item-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:#fff;border:0.5px dashed rgba(0,0,0,.2);border-radius:10px;font-size:14px;color:#555;cursor:pointer;font-family:inherit;margin-bottom:20px;transition:all .12s;}
.add-item-btn:hover{background:#f0efe9;border-color:#aaa;}
.ing-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border:0.5px solid rgba(0,0,0,.08);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .12s;user-select:none;}
.ing-item:hover{background:#f7f6f1;}
.ing-item.oos{background:#fef6f6;border-color:#f5c0c0;}
.ing-item.oos .ing-name{color:#999;text-decoration:line-through;}
.ing-item-custom{border-style:dashed;}
.ing-left{display:flex;align-items:center;gap:10px;}
.ing-icon{font-size:19px;width:28px;text-align:center;}
.ing-name{font-size:15px;font-weight:500;}
.ing-sub{font-size:11px;color:#aaa;margin-top:1px;}
.yel-pill{font-size:10px;font-weight:700;background:#fdf0d8;color:#8a5a10;padding:2px 7px;border-radius:20px;margin-left:6px;}
.ing-right{display:flex;align-items:center;gap:4px;}
.ing-toggle{width:23px;height:23px;border-radius:50%;border:0.5px solid rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.ing-item.oos .ing-toggle{background:#fcc;border-color:#f99;color:#c0392b;}
.ing-item:not(.oos) .ing-toggle{background:#e8f5f0;border-color:#a8d8c8;color:#0a6b4e;}
.del-btn{width:28px;height:28px;border-radius:50%;background:transparent;border:0.5px solid rgba(0,0,0,.12);color:#ccc;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:2px;padding:0;}
.del-btn:hover{background:#fee;border-color:#fcc;color:#c0392b;}
.custom-badge{font-size:10px;background:#f0f0f0;border-radius:4px;padding:1px 5px;color:#999;margin-left:5px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:640px;}
.modal h2{font-size:17px;font-weight:600;margin:0 0 20px;text-align:center;}
.modal label{font-size:12px;font-weight:600;color:#999;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px;}
.modal input,.modal select{width:100%;padding:12px 14px;border:0.5px solid rgba(0,0,0,.18);border-radius:10px;font-size:15px;font-family:inherit;background:#f7f6f1;margin-bottom:16px;outline:none;}
.modal input:focus,.modal select:focus{border-color:#1a1a1a;background:#fff;}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-btns{display:flex;gap:10px;margin-top:4px;}
.modal-cancel{flex:1;padding:13px;background:transparent;border:0.5px solid rgba(0,0,0,.15);border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit;color:#666;}
.modal-save{flex:2;padding:13px;background:#1a1a1a;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit;color:#fff;font-weight:500;}
.shop-empty{text-align:center;padding:44px 20px;color:#aaa;font-size:14px;line-height:1.6;}
.shop-item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;border:0.5px solid rgba(0,0,0,.08);border-radius:10px;margin-bottom:6px;cursor:pointer;user-select:none;transition:all .12s;}
.shop-item:active{transform:scale(.99);}
.shop-item.got{opacity:.45;background:#f0efe9;}
.shop-item.got .si-name{text-decoration:line-through;color:#999;}
.si-check{width:23px;height:23px;border-radius:6px;border:1.5px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;}
.shop-item.got .si-check{background:#0a6b4e;border-color:#0a6b4e;}
.si-icon{font-size:18px;width:24px;text-align:center;}
.si-name{font-size:15px;font-weight:500;flex:1;}
.si-cat{font-size:11px;color:#aaa;}
.clear-oos{width:100%;padding:13px;background:#fff;border:0.5px solid rgba(0,0,0,.15);border-radius:10px;font-size:14px;color:#666;cursor:pointer;font-family:inherit;margin-top:12px;}
.clear-oos:hover{background:#f0efe9;}
.footer{margin-top:22px;padding-top:12px;border-top:0.5px solid rgba(0,0,0,.08);font-size:11px;color:#bbb;text-align:center;}
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" onclick="showTab('pantry',this)">📦 Pantry</button>
  <button class="tab" onclick="showTab('shop',this)">🛒 Shop</button>
</div>

<div class="screen active" id="tab-pantry">
  <div class="hdr"><h1>Pantry</h1></div>
  <p class="intro">Tap any item to mark it out of stock. It drops onto your shopping list automatically. Tap again to restock.</p>
  <div class="legend">
    <span style="background:#e2f2ea;color:#1a6b48;">● anytime</span>
    <span style="background:#fdf0d8;color:#8a5a10;">🟡 post-workout only</span>
  </div>
  <div id="oos-count-badge"></div>
  <button class="add-item-btn" id="open-add-modal">＋ Add item</button>
  <div id="ingredient-list"></div>
  <div class="footer">Saves automatically on this device.</div>
</div>

<div class="screen" id="tab-shop">
  <div class="hdr"><h1>Shopping list</h1></div>
  <p class="intro">Everything you marked out of stock, grouped by aisle. Tap to check off as you shop.</p>
  <div id="shop-list"></div>
</div>

<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h2>Add item</h2>
    <label>Item name</label>
    <input type="text" id="new-ing-name" placeholder="e.g. Coconut aminos" autocomplete="off">
    <div class="modal-row">
      <div>
        <label>Aisle</label>
        <select id="new-ing-cat">
          <option>Produce</option>
          <option>Meat &amp; Seafood</option>
          <option>Dairy &amp; Eggs</option>
          <option>Canned &amp; Protein Snacks</option>
          <option>Fats &amp; Nuts</option>
          <option>Drinks &amp; Condiments</option>
          <option>Spices</option>
          <option>Starches</option>
          <option>Supplement</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label>Tag</label>
        <select id="new-ing-light">
          <option value="green">Anytime</option>
          <option value="yellow">Post-workout</option>
        </select>
      </div>
    </div>
    <label>Emoji (optional)</label>
    <input type="text" id="new-ing-icon" placeholder="🥗" maxlength="2" style="font-size:22px;text-align:center;">
    <div class="modal-btns">
      <button class="modal-cancel" id="close-add-modal">Cancel</button>
      <button class="modal-save" id="save-add-modal">Add item</button>
    </div>
  </div>
</div>

<script>
// ── GROCERY LIST ─────────────────────────────────────────────────
// light: green = anytime | yellow = post-workout only
const ITEMS = [
  // Produce
  {id:"greens",     name:"Power greens blend",     icon:"🥬", cat:"Produce", light:"green"},
  {id:"spinach",    name:"Baby spinach",           icon:"🥬", cat:"Produce", light:"green"},
  {id:"onion",      name:"Onion",                  icon:"🧅", cat:"Produce", light:"green"},
  {id:"avocado",    name:"Avocados",               icon:"🥑", cat:"Produce", light:"green"},
  {id:"lemon",      name:"Lemons",                 icon:"🍋", cat:"Produce", light:"green"},
  {id:"ginger",     name:"Fresh ginger root",      icon:"🫚", cat:"Produce", light:"green"},
  {id:"blackberry", name:"Blackberries",           icon:"🫐", cat:"Produce", light:"green"},
  {id:"raspberry",  name:"Raspberries",            icon:"🫐", cat:"Produce", light:"green"},
  {id:"blueberry",  name:"Blueberries",            icon:"🫐", cat:"Produce", light:"green"},
  {id:"strawberry", name:"Strawberries",           icon:"🍓", cat:"Produce", light:"green"},
  {id:"granny",     name:"Granny Smith apples",    icon:"🍏", cat:"Produce", light:"yellow"},
  {id:"kiwi",       name:"Gold kiwis",             icon:"🥝", cat:"Produce", light:"yellow"},
  // Meat & Seafood
  {id:"bison",      name:"Bison",                  icon:"🦬", cat:"Meat & Seafood", light:"green"},
  {id:"salmon",     name:"Salmon",                 icon:"🐟", cat:"Meat & Seafood", light:"green"},
  {id:"chicken",    name:"Chicken tenders / breast",icon:"🍗",cat:"Meat & Seafood", light:"green"},
  {id:"meatballs",  name:"Amylu chicken meatballs",icon:"🍗", cat:"Meat & Seafood", light:"green"},
  // Dairy & Eggs
  {id:"eggs",       name:"Eggs",                   icon:"🥚", cat:"Dairy & Eggs", light:"green"},
  {id:"yogurt",     name:"FAGE 2% Greek yogurt",   icon:"🥛", cat:"Dairy & Eggs", light:"green"},
  {id:"almondmilk", name:"Unsweetened almond milk",icon:"🥛", cat:"Dairy & Eggs", light:"green"},
  // Canned & Protein Snacks
  {id:"sardines",   name:"Sardines (olive oil/water)",icon:"🐟",cat:"Canned & Protein Snacks", light:"green"},
  {id:"tuna",       name:"Canned skipjack tuna",   icon:"🐟", cat:"Canned & Protein Snacks", light:"green"},
  {id:"clams",      name:"Canned clams",           icon:"🦪", cat:"Canned & Protein Snacks", light:"green"},
  {id:"beefsticks", name:"Chomps beef sticks",     icon:"🥩", cat:"Canned & Protein Snacks", light:"green"},
  // Fats & Nuts
  {id:"oliveoil",   name:"Extra virgin olive oil", icon:"🫒", cat:"Fats & Nuts", light:"green"},
  {id:"avomayo",    name:"Avocado oil mayo",       icon:"🫙", cat:"Fats & Nuts", light:"green"},
  {id:"walnuts",    name:"Walnuts",                icon:"🌰", cat:"Fats & Nuts", light:"green"},
  {id:"pumpkin",    name:"Pumpkin seeds",          icon:"🎃", cat:"Fats & Nuts", light:"green"},
  {id:"chia",       name:"Chia seeds",             icon:"⚫️", cat:"Fats & Nuts", light:"green"},
  // Drinks & Condiments
  {id:"bonebroth",  name:"Bone broth",             icon:"🍵", cat:"Drinks & Condiments", light:"green"},
  {id:"sparkling",  name:"Sparkling water",        icon:"💧", cat:"Drinks & Condiments", light:"green"},
  {id:"salsa",      name:"Lucky Habanero Salsa",   icon:"🌶", cat:"Drinks & Condiments", light:"green"},
  {id:"mustard",    name:"Yellow mustard",         icon:"🫙", cat:"Drinks & Condiments", light:"green"},
  {id:"pgarlic",    name:"Pickled garlic",         icon:"🧄", cat:"Drinks & Condiments", light:"green"},
  {id:"saltpepper", name:"Salt & pepper (no grinder)",icon:"🧂",cat:"Drinks & Condiments", light:"green"},
  // Spices
  {id:"cinnamon",   name:"Ceylon cinnamon",        icon:"🟤", cat:"Spices", light:"green"},
  {id:"oregano",    name:"Oregano",                icon:"🌿", cat:"Spices", light:"green"},
  {id:"parsley",    name:"Parsley",                icon:"🌿", cat:"Spices", light:"green"},
  {id:"cumin",      name:"Cumin",                  icon:"🟤", cat:"Spices", light:"green"},
  {id:"paprika",    name:"Smoked paprika",         icon:"🌶", cat:"Spices", light:"green"},
  {id:"turmeric",   name:"Turmeric",               icon:"🟡", cat:"Spices", light:"green"},
  {id:"onionpwd",   name:"Onion powder",           icon:"🧅", cat:"Spices", light:"green"},
  {id:"garlicpwd",  name:"Garlic powder",          icon:"🧄", cat:"Spices", light:"green"},
  {id:"cayenne",    name:"Cayenne",                icon:"🌶", cat:"Spices", light:"green"},
  {id:"thyme",      name:"Thyme",                  icon:"🌿", cat:"Spices", light:"green"},
  // Starches
  {id:"rice",       name:"White rice (Lundberg)",  icon:"🍚", cat:"Starches", light:"yellow"},
  {id:"oats",       name:"GF rolled oats",         icon:"🥣", cat:"Starches", light:"yellow"},
  {id:"quinoa",     name:"Quinoa",                 icon:"🌾", cat:"Starches", light:"yellow"},
  // Supplement
  {id:"creatine",   name:"Creatine with HMB",      icon:"💊", cat:"Supplement", light:"green"},
  {id:"nmn",        name:"NMN",                    icon:"💊", cat:"Supplement", light:"green"},
  {id:"shilajit",   name:"Shilajit",               icon:"💊", cat:"Supplement", light:"green"},
  {id:"beepollen",  name:"Bee pollen",             icon:"🐝", cat:"Supplement", light:"green"},
  {id:"whey",       name:"Naked 100% whey isolate",icon:"🥛", cat:"Supplement", light:"green"},
];

const CAT_ORDER = ["Produce","Meat & Seafood","Dairy & Eggs","Canned & Protein Snacks","Fats & Nuts","Drinks & Condiments","Spices","Starches","Supplement","Other"];

// ── STORAGE ──────────────────────────────────────────────────────
const STOCK_KEY="gl1_stock", CUSTOM_KEY="gl1_custom", GOT_KEY="gl1_got";
let outOfStock=new Set();     // ids needing purchase
let gotItems=new Set();       // ids checked off while shopping
let customItems=[];

function load(){
  try{const r=localStorage.getItem(STOCK_KEY); if(r) outOfStock=new Set(JSON.parse(r));}catch(e){}
  try{const r=localStorage.getItem(CUSTOM_KEY); if(r) customItems=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem(GOT_KEY); if(r) gotItems=new Set(JSON.parse(r));}catch(e){}
}
function saveStock(){ try{localStorage.setItem(STOCK_KEY,JSON.stringify([...outOfStock]));}catch(e){} }
function saveCustom(){ try{localStorage.setItem(CUSTOM_KEY,JSON.stringify(customItems));}catch(e){} }
function saveGot(){ try{localStorage.setItem(GOT_KEY,JSON.stringify([...gotItems]));}catch(e){} }
function allItems(){ return [...ITEMS, ...customItems]; }

// ── PANTRY ───────────────────────────────────────────────────────
function renderPantry(){
  const n=outOfStock.size;
  document.getElementById('oos-count-badge').innerHTML =
    n>0 ? '<span class="oos-count">'+n+' item'+(n>1?'s':'')+' to buy</span>' : '';

  const groups={};
  allItems().forEach(it=>{ (groups[it.cat]=groups[it.cat]||[]).push(it); });

  const cats=CAT_ORDER.filter(c=>groups[c]).concat(Object.keys(groups).filter(c=>!CAT_ORDER.includes(c)));
  const list=document.getElementById('ingredient-list');
  list.innerHTML='';

  cats.forEach(cat=>{
    const t=document.createElement('div');
    t.className='section-title'; t.textContent=cat;
    list.appendChild(t);
    groups[cat].forEach(it=>{
      const oos=outOfStock.has(it.id), custom=!!it.custom;
      const row=document.createElement('div');
      row.className='ing-item'+(oos?' oos':'')+(custom?' ing-item-custom':'');
      row.innerHTML=
        '<div class="ing-left"><div class="ing-icon">'+(it.icon||'📦')+'</div><div>'
        +'<div class="ing-name">'+it.name
        +(it.light==='yellow'?'<span class="yel-pill">🟡</span>':'')
        +(custom?'<span class="custom-badge">custom</span>':'')+'</div>'
        +'<div class="ing-sub">'+(oos?'on shopping list':'in stock')+'</div>'
        +'</div></div>'
        +'<div class="ing-right"><div class="ing-toggle">'+(oos?'✕':'✓')+'</div>'
        +(custom?'<button class="del-btn" data-del="'+it.id+'">✕</button>':'')+'</div>';
      row.addEventListener('click',e=>{
        if(e.target.closest('.del-btn')) return;
        if(outOfStock.has(it.id)){ outOfStock.delete(it.id); gotItems.delete(it.id); }
        else outOfStock.add(it.id);
        saveStock(); saveGot(); renderPantry(); renderShop();
      });
      list.appendChild(row);
    });
  });

  list.querySelectorAll('.del-btn[data-del]').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const id=b.dataset.del;
      const it=customItems.find(x=>x.id===id);
      if(it && confirm('Remove "'+it.name+'" from your pantry?')){
        customItems=customItems.filter(x=>x.id!==id);
        outOfStock.delete(id); gotItems.delete(id);
        saveCustom(); saveStock(); saveGot(); renderPantry(); renderShop();
      }
    });
  });
}

// ── SHOP ─────────────────────────────────────────────────────────
function renderShop(){
  const el=document.getElementById('shop-list');
  el.innerHTML='';
  if(outOfStock.size===0){
    el.innerHTML='<div class="shop-empty">Nothing on the list yet ✓<br><span style="font-size:12px;color:#ccc;">Mark items out of stock in the Pantry tab and they show up here.</span></div>';
    return;
  }
  const items=allItems().filter(it=>outOfStock.has(it.id));
  const groups={};
  items.forEach(it=>{ (groups[it.cat]=groups[it.cat]||[]).push(it); });
  const cats=CAT_ORDER.filter(c=>groups[c]).concat(Object.keys(groups).filter(c=>!CAT_ORDER.includes(c)));

  const gotCount=items.filter(it=>gotItems.has(it.id)).length;

  cats.forEach(cat=>{
    const t=document.createElement('div');
    t.className='section-title'; t.textContent=cat;
    el.appendChild(t);
    groups[cat].forEach(it=>{
      const got=gotItems.has(it.id);
      const row=document.createElement('div');
      row.className='shop-item'+(got?' got':'');
      row.innerHTML='<div class="si-check">'+(got?'✓':'')+'</div>'
        +'<div class="si-icon">'+(it.icon||'📦')+'</div>'
        +'<div class="si-name">'+it.name+'</div>'
        +(it.light==='yellow'?'<span class="yel-pill">🟡</span>':'');
      row.addEventListener('click',()=>{
        if(gotItems.has(it.id)) gotItems.delete(it.id); else gotItems.add(it.id);
        saveGot(); renderShop();
      });
      el.appendChild(row);
    });
  });

  const clear=document.createElement('button');
  clear.className='clear-oos';
  clear.textContent='✓ Done shopping · restock everything';
  clear.addEventListener('click',()=>{
    if(confirm('Mark all '+items.length+' items back in stock?')){
      items.forEach(it=>{ outOfStock.delete(it.id); gotItems.delete(it.id); });
      saveStock(); saveGot(); renderPantry(); renderShop();
    }
  });
  el.appendChild(clear);
}

// ── TABS ─────────────────────────────────────────────────────────
function showTab(name, el){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(el) el.classList.add('active');
}

// ── ADD ITEM MODAL ───────────────────────────────────────────────
const addModal=document.getElementById('add-modal');
document.getElementById('open-add-modal').addEventListener('click',()=>{
  document.getElementById('new-ing-name').value='';
  document.getElementById('new-ing-icon').value='';
  addModal.classList.add('open');
});
document.getElementById('close-add-modal').addEventListener('click',()=>addModal.classList.remove('open'));
addModal.addEventListener('click',e=>{ if(e.target===addModal) addModal.classList.remove('open'); });
document.getElementById('save-add-modal').addEventListener('click',()=>{
  const nameEl=document.getElementById('new-ing-name');
  const name=nameEl.value.trim();
  if(!name){ nameEl.style.borderColor='#c0392b'; nameEl.focus(); return; }
  nameEl.style.borderColor='';
  customItems.push({
    id:'custom_'+Date.now(),
    name,
    icon:document.getElementById('new-ing-icon').value.trim()||'📦',
    cat:document.getElementById('new-ing-cat').value,
    light:document.getElementById('new-ing-light').value,
    custom:true
  });
  saveCustom();
  addModal.classList.remove('open');
  renderPantry();
});
document.getElementById('new-ing-name').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('save-add-modal').click();
});

// ── INIT ─────────────────────────────────────────────────────────
load();
renderPantry();
renderShop();
</script>
</body>
</html>
